<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP notes:
        - `worker-src blob:` is required: the ESM worker is instantiated from a
          file:// URL and Chromium treats module workers strictly.
      - `frame-src *` is required: the in-app browser's <webview> is a child
          frame, and without it the host CSP would block all web navigation.
        - `connect-src` is limited to the Hugging Face hosts used for the
          one-time model download, plus blob:/data: for WASM instantiation.
        - No `unsafe-eval`; the ONNX WASM runtime does not need it.
        - Browsed web pages are isolated in the <webview>, so this policy only
          governs the app shell itself.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' blob:;
        worker-src 'self' blob:;
        child-src 'self' blob:;
        frame-src * blob: data:;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        font-src 'self' data:;
        connect-src 'self' data: blob: https://huggingface.co https://*.huggingface.co https://*.hf.co;
        object-src 'none';
        base-uri 'none';
        form-action 'none';
      "
    />
    <title>Arcanode AI Browser</title>
    <link rel="stylesheet" href="index.css" />
  </head>

    <div id="app">
      <!-- ============ Tab strip ============ -->
      <div class="tabstrip">
        <div class="tabstrip-brand" title="Arcanode AI Browser">
          <svg class="ic brand"><use href="#i-sparkle" /></svg>
        </div>
        <div class="tabstrip-tabs" id="tabstrip-tabs"></div>
        <button class="tabstrip-new" id="btn-new-tab" title="New tab (Ctrl+T)">
          <svg class="ic"><use href="#i-plus" /></svg>
        </button>
        <div class="tabstrip-spacer"></div>
      </div>

      <!-- ============ Toolbar ============ -->
      <header class="toolbar">
        <div class="nav-group">
          <button class="icon-btn" id="btn-back" title="Back (Alt+Left)" disabled>
            <svg class="ic"><use href="#i-back" /></svg>
          </button>
          <button class="icon-btn" id="btn-forward" title="Forward (Alt+Right)" disabled>
            <svg class="ic"><use href="#i-forward" /></svg>
          </button>
          <button class="icon-btn" id="btn-reload" title="Reload (Ctrl+R)">
            <svg class="ic" id="reload-icon"><use href="#i-reload" /></svg>
          </button>
          <button class="icon-btn" id="btn-home" title="Home">
            <svg class="ic"><use href="#i-home" /></svg>
          </button>
        </div>

        <div class="omnibox" id="omnibox">
          <span class="omnibox-lead" id="omnibox-lead" title="Connection status">
            <svg class="ic"><use href="#i-search" /></svg>
          </span>
          <input
            id="url-input"
            type="text"
            placeholder="Search DuckDuckGo or enter a URL"
            spellcheck="false"
            autocomplete="off"
          />
          <button class="omnibox-go" id="btn-go" title="Go">
            <svg class="ic"><use href="#i-forward" /></svg>
          </button>
        </div>

        <div class="toolbar-right">
          <div class="engine-chip" id="engine-status" title="Arcanode AI Browser engine status">
            <span class="dot" id="engine-dot"></span>
            <span id="engine-label">Starting…</span>
          </div>
          <button class="icon-btn" id="btn-toggle-sidebar" title="Toggle AI sidebar (Ctrl+B)">
            <svg class="ic"><use href="#i-sidebar" /></svg>
          </button>
        </div>

        <!-- Page load progress, spans the full toolbar width -->
        <div class="load-bar" id="load-bar"></div>
      </header>

      <!-- ============ Main ============ -->
      <main class="layout" id="layout">
        <section class="browser-pane">
          <!-- The page itself is rendered by a native BrowserView positioned
               over this pane by the main process; no DOM element lives here. -->

        </section>

        <div class="resizer" id="resizer" title="Drag to resize"></div>

        <aside class="ai-pane" id="ai-pane">
          <div class="ai-header">
            <div class="ai-title">
              <svg class="ic accent"><use href="#i-sparkle" /></svg>
               <h2>Arcanode AI Browser</h2>
            </div>
            <span class="badge" title="AI inference runs entirely on your device — nothing is sent to the cloud">On-device</span>
          </div>

          <!-- Feature launcher: every AI capability is a card. Clicking one
                opens that feature as a full modal inside the sidebar. -->

            <p class="hint">Pick an on-device AI tool. Everything runs locally — nothing leaves your machine.</p>
            <div class="feature-grid" id="feature-grid">

                <span class="feature-ic"><svg class="ic"><use href="#i-clock" /></svg></span>
                <span class="feature-name">History</span>
                <span class="feature-desc">Visited pages</span>
              </button>
              <button class="feature-card" data-feature="summarize">

              <span class="ai-modal-ic" id="ai-modal-ic"><svg class="ic"><use href="#i-sparkle" /></svg></span>
              <span class="ai-modal-title" id="ai-modal-title">Tool</span>
            </div>

            <div class="ai-modal-body" id="ai-modal-body"></div>
          </div>

          <footer class="ai-footer">
            <div class="progress" id="progress-wrap" hidden>
              <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="footer-row">
              <span class="progress-text" id="progress-text"></span>
              <button class="cancel-btn" id="btn-cancel" hidden>
                <svg class="ic"><use href="#i-stop" /></svg> Stop
              </button>
            </div>
          </footer>
        </aside>
      </main>

      <!-- Toasts -->
      <div class="toasts" id="toasts" aria-live="polite"></div>
    </div>

    <!-- Loaded as a module so `import` works and `import.meta.url` resolves -->
    <script type="module" src="renderer.js"></script>
  </body>
</html>
